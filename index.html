<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
  <title>Populasi Provinsi Indonesia 2024 | Visual Interaktif</title>
  <!-- Font & style dasar -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(135deg, #e9f0f9 0%, #f3f6fc 100%);
      font-family: 'Inter', 'Segoe UI', Roboto, system-ui, sans-serif;
      padding: 1.5rem;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 1250px;
      margin: 1rem auto;
      padding: 1.8rem 2rem;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(18px);
      background: #ffffff;
      border-radius: 32px;
      box-shadow: 0 20px 40px rgba(0, 20, 40, 0.12), 0 8px 20px rgba(0,0,0,0.05);
      border: 1px solid rgba(203, 213, 225, 0.5);
    }

    h1 {
      font-size: 1.9rem;
      text-align: center;
      color: #0b3b5c;
      margin-bottom: 0.35rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .header-icon {
      display: inline-block;
      width: 34px;
      height: 34px;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      filter: drop-shadow(0 2px 4px rgba(0,80,150,0.2));
    }

.subtitle {
  text-align: center;
  color: #285b7a;
  margin-bottom: 2rem;
  font-weight: 500;
  font-size: 1rem;
  background: #ecf3fa;
  display: block;          /* ubah ke block */
  padding: 0.4rem 1.6rem;
  border-radius: 40px;
  margin-left: auto;       /* tetap auto */
  margin-right: auto;      /* tetap auto */
  width: fit-content;      /* atau ganti dengan max-width: 400px jika perlu */
}

    .inline-icon {
      display: inline-block;
      width: 18px;
      height: 18px;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      vertical-align: middle;
      margin-right: 0.3rem;
      opacity: 0.75;
    }

    .filters-panel {
      display: grid;
      grid-template-columns: 1fr 1fr 1.3fr 1.3fr;
      gap: 1.2rem;
      background: #f9fcff;
      padding: 1.4rem 1.4rem;
      border-radius: 24px;
      margin-bottom: 1.5rem;
      box-shadow: 0 6px 14px rgba(0,0,0,0.03);
      border: 1px solid #e9eff6;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }

    .filter-group label {
      font-weight: 600;
      display: flex;
      align-items: center;
      margin-bottom: 0.5rem;
      font-size: 0.85rem;
      color: #1e3b4f;
    }

    .input-with-icon {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
    }

    .prefix-icon {
      position: absolute;
      left: 12px;
      width: 18px;
      height: 18px;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      pointer-events: none;
      opacity: 0.5;
      z-index: 2;
    }

    .filter-group input[type="text"],
    .input-with-icon select {
      width: 100%;
      padding: 0.6rem 0.9rem 0.6rem 2.4rem;
      border: 1px solid #cfdde9;
      border-radius: 14px;
      font-size: 0.9rem;
      color: #1e3b4f;
      background: white;
      height: 42px;
      transition: all 0.2s;
      font-weight: 500;
    }

    .filter-group input[type="number"] {
      width: 100%;
      padding: 0.6rem 0.4rem;
      border: 1px solid #cfdde9;
      border-radius: 14px;
      font-size: 0.85rem;
      color: #1e3b4f;
      background: white;
      height: 42px;
      text-align: center;
      font-weight: 500;
    }

    .filter-group input:focus,
    .input-with-icon select:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,0.15);
    }

    .range-inputs {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      margin-bottom: 0.5rem;
    }

    .range-inputs input {
      flex: 1;
      min-width: 60px;
    }

    .range-inputs span {
      color: #5f7d9c;
      font-weight: 500;
    }

    .slider-wrapper {
      position: relative;
      height: 14px;
      margin-top: 0.2rem;
    }

    .slider-wrapper::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      height: 6px;
      background: #dce5f0;
      border-radius: 10px;
      z-index: 1;
    }

    .dual-range-slider {
      position: absolute;
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      background: transparent;
      pointer-events: none;
      top: 50%;
      transform: translateY(-50%);
      margin: 0;
      z-index: 2;
      height: 6px;
    }

    .dual-range-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #2563eb;
      border: 2px solid white;
      cursor: pointer;
      pointer-events: auto;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    .interactive-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: white;
      padding: 0.9rem 1.5rem;
      border-radius: 18px;
      margin-bottom: 1.2rem;
      border: 1px solid #e2eaf5;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .sort-control-group {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .sort-control-group label {
      font-weight: 700;
      color: #1e3b4f;
      display: flex;
      align-items: center;
      font-size: 0.9rem;
    }

    .sort-control-group select {
      padding: 0.5rem 1rem 0.5rem 2.4rem;
      border: 2px solid #2563eb;
      border-radius: 12px;
      font-weight: 600;
      color: #0c3b6b;
      background: #eef4ff;
      cursor: pointer;
      height: 40px;
    }

    .right-meta {
      display: flex;
      align-items: center;
      gap: 2rem;
    }

    .toggle-highlight {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-weight: 600;
      color: #2c4b6b;
      cursor: pointer;
    }

    .chart-container {
      background: white;
      border-radius: 24px;
      padding: 1rem 0.6rem;
      box-shadow: 0 8px 18px rgba(0,0,0,0.04);
      border: 1px solid #e9f0f8;
    }

    .header-row {
      display: flex;
      font-weight: 700;
      padding: 0.8rem 0.6rem;
      background: #f4f9ff;
      border-radius: 14px 14px 0 0;
      color: #1f486b;
      font-size: 0.85rem;
      border-bottom: 2px solid #dce5f0;
    }

    .province-label { width: 250px; flex-shrink: 0; padding-left: 0.8rem; }
    .bar-label { flex-grow: 1; padding-left: 1rem; }
    .jumlah-label { width: 140px; text-align: right; padding-right: 0.5rem; }
    .percent-label { width: 110px; text-align: right; padding-right: 1rem; }

    .bars-list {
      max-height: 55vh;
      overflow-y: auto;
    }

    .bar-item {
      display: flex;
      align-items: center;
      padding: 0.7rem 0.5rem;
      border-bottom: 1px solid #f0f4fc;
      transition: background 0.2s;
    }

    .province-name {
      width: 250px;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .name-text {
      font-weight: 650;
      color: #0b2b44;
    }

    .region-tag {
      font-size: 0.65rem;
      background: #e6edf6;
      padding: 0.15rem 0.4rem;
      border-radius: 6px;
    }

    .bar-wrapper {
      flex-grow: 1;
      background: #e9eff6;
      border-radius: 20px;
      margin: 0 1rem;
      height: 18px;
      overflow: hidden;
    }

    .bar {
      background: linear-gradient(90deg, #2563eb, #1e3a8a);
      height: 100%;
      border-radius: 20px;
      width: 0%;
    }

    .pop-number {
      width: 140px;
      text-align: right;
      font-weight: 600;
      font-family: monospace;
    }

    .percent-value {
      width: 110px;
      text-align: right;
      background: #f1f6fd;
      padding: 0.2rem 0.6rem;
      border-radius: 20px;
      font-weight: 500;
    }

    .no-data {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3rem;
      color: #b91c1c;
      background: #fee2e2;
      border-radius: 20px;
      margin: 1rem;
    }

    @media (max-width: 1000px) {
      .filters-panel { grid-template-columns: 1fr 1fr; }
      .province-label, .province-name { width: 180px; }
    }
  </style>
</head>
<body>
<div class="container">
  <h1>
    <span class="header-icon" id="iconChart"></span>
    Jumlah Penduduk per Provinsi di Indonesia (2024)
  </h1>
  <p class="subtitle" id="totalDisplay"></p>

  <div class="filters-panel">
    <div class="filter-group">
      <label><span class="inline-icon" id="iconSearch1"></span>Filter Nama</label>
      <div class="input-with-icon">
        <span class="prefix-icon" id="iconSearch2"></span>
        <input type="text" id="searchInput" placeholder="Cari provinsi...">
      </div>
    </div>
    <div class="filter-group">
      <label><span class="inline-icon" id="iconGlobe1"></span>Wilayah</label>
      <div class="input-with-icon">
        <span class="prefix-icon" id="iconGlobe2"></span>
        <select id="islandSelect"></select>
      </div>
    </div>
    <div class="filter-group">
      <label><span class="inline-icon" id="iconAdj1"></span>Populasi (ribu)</label>
      <div class="range-inputs">
        <input type="number" id="minPopInput" step="100">
        <span>-</span>
        <input type="number" id="maxPopInput" step="100">
      </div>
      <div class="slider-wrapper">
        <input type="range" id="minPopSlider" class="dual-range-slider">
        <input type="range" id="maxPopSlider" class="dual-range-slider">
      </div>
    </div>
    <div class="filter-group">
      <label><span class="inline-icon" id="iconAdj2"></span>% Nasional</label>
      <div class="range-inputs">
        <input type="number" id="minPctInput" step="0.1">
        <span>-</span>
        <input type="number" id="maxPctInput" step="0.1">
      </div>
      <div class="slider-wrapper">
        <input type="range" id="minPctSlider" class="dual-range-slider" step="0.5">
        <input type="range" id="maxPctSlider" class="dual-range-slider" step="0.5">
      </div>
    </div>
  </div>

  <div class="interactive-controls">
    <div class="sort-control-group">
      <label><span class="inline-icon" id="iconSortLabel"></span>Urutan:</label>
      <select id="sortSelect"></select>
    </div>
    <div class="right-meta">
      <label class="toggle-highlight">
        <input type="checkbox" id="highlightCheckbox" checked>
        <span><span class="inline-icon" id="iconBulb"></span>Highlight Ekstrem</span>
      </label>
      <div class="info-stat" id="infoStat"></div>
    </div>
  </div>

  <div class="chart-container">
    <div class="header-row">
      <div class="province-label">Provinsi</div>
      <div class="bar-label">Visualisasi</div>
      <div class="jumlah-label">Jumlah (rb)</div>
      <div class="percent-label">% Nasional</div>
    </div>
    <div id="barsList" class="bars-list"></div>
  </div>
  <div class="source" style="margin-top:1.5rem; text-align:center; color:#4b5e71;">
    Sumber: BPS 2024 · Data dalam ribuan jiwa
  </div>
</div>

<script>
  (function() {
    // Data provinsi
    const provinsiData = [
      { name: "Aceh", pop: 5554.8, island: "Sumatera" },
      { name: "Sumatera Utara", pop: 15588.5, island: "Sumatera" },
      { name: "Sumatera Barat", pop: 5836.2, island: "Sumatera" },
      { name: "Riau", pop: 6728.1, island: "Sumatera" },
      { name: "Kep. Riau", pop: 2183.3, island: "Sumatera" },
      { name: "Jambi", pop: 3724.3, island: "Sumatera" },
      { name: "Sumatera Selatan", pop: 8837.3, island: "Sumatera" },
      { name: "Kep. Bangka Belitung", pop: 1531.5, island: "Sumatera" },
      { name: "Bengkulu", pop: 2112.2, island: "Sumatera" },
      { name: "Lampung", pop: 9419.6, island: "Sumatera" },
      { name: "DKI Jakarta", pop: 10684.9, island: "Jawa" },
      { name: "Jawa Barat", pop: 50345.2, island: "Jawa" },
      { name: "Banten", pop: 12431.4, island: "Jawa" },
      { name: "Jawa Tengah", pop: 37892.3, island: "Jawa" },
      { name: "DI Yogyakarta", pop: 3759.5, island: "Jawa" },
      { name: "Jawa Timur", pop: 41814.5, island: "Jawa" },
      { name: "Kalimantan Barat", pop: 5695.5, island: "Kalimantan" },
      { name: "Kalimantan Tengah", pop: 2809.7, island: "Kalimantan" },
      { name: "Kalimantan Selatan", pop: 4273.4, island: "Kalimantan" },
      { name: "Kalimantan Timur", pop: 4045.9, island: "Kalimantan" },
      { name: "Kalimantan Utara", pop: 739.8, island: "Kalimantan" },
      { name: "Sulawesi Utara", pop: 2701.8, island: "Sulawesi" },
      { name: "Gorontalo", pop: 1227.8, island: "Sulawesi" },
      { name: "Sulawesi Tengah", pop: 3121.8, island: "Sulawesi" },
      { name: "Sulawesi Selatan", pop: 9463.4, island: "Sulawesi" },
      { name: "Sulawesi Barat", pop: 1503.2, island: "Sulawesi" },
      { name: "Sulawesi Tenggara", pop: 2793.1, island: "Sulawesi" },
      { name: "Bali", pop: 4433.3, island: "Nusa Tenggara & Bali" },
      { name: "Nusa Tenggara Barat", pop: 5646, island: "Nusa Tenggara & Bali" },
      { name: "Nusa Tenggara Timur", pop: 5656, island: "Nusa Tenggara & Bali" },
      { name: "Maluku", pop: 1945.6, island: "Maluku & Papua" },
      { name: "Maluku Utara", pop: 1355.6, island: "Maluku & Papua" },
      { name: "Papua Barat", pop: 1205.8, island: "Maluku & Papua" },
      { name: "Papua", pop: 4542.6, island: "Maluku & Papua" }
    ];

    const totalPop = 281603.8;
    const maxPop = Math.max(...provinsiData.map(d => d.pop));
    const minPopData = Math.min(...provinsiData.map(d => d.pop));

    // State
    let searchQuery = "";
    let minPop = 0;
    let maxPopFilter = maxPop;
    let minPercent = 0;
    let maxPercent = 100;
    let selectedIsland = "Semua";
    let currentSortRule = "pop-desc";
    let enableHighlight = true;

    // DOM elements
    const searchInput = document.getElementById('searchInput');
    const islandSelect = document.getElementById('islandSelect');
    const minPopInput = document.getElementById('minPopInput');
    const maxPopInput = document.getElementById('maxPopInput');
    const minPopSlider = document.getElementById('minPopSlider');
    const maxPopSlider = document.getElementById('maxPopSlider');
    const minPctInput = document.getElementById('minPctInput');
    const maxPctInput = document.getElementById('maxPctInput');
    const minPctSlider = document.getElementById('minPctSlider');
    const maxPctSlider = document.getElementById('maxPctSlider');
    const sortSelect = document.getElementById('sortSelect');
    const highlightCheckbox = document.getElementById('highlightCheckbox');
    const barsList = document.getElementById('barsList');
    const infoStat = document.getElementById('infoStat');
    const totalDisplay = document.getElementById('totalDisplay');

    // Helper percent
    function getPercent(pop) { return (pop / totalPop) * 100; }

    // Set ikon via background-image
    function setIcon(el, url) { if(el) el.style.backgroundImage = `url(${url})`; }
    const baseIcon = "https://unpkg.com/heroicons@2.0.18/24/outline/";
    setIcon(document.getElementById('iconChart'), baseIcon+"chart-bar.svg");
    setIcon(document.getElementById('iconSearch1'), baseIcon+"magnifying-glass.svg");
    setIcon(document.getElementById('iconSearch2'), baseIcon+"magnifying-glass.svg");
    setIcon(document.getElementById('iconGlobe1'), baseIcon+"globe-asia-australia.svg");
    setIcon(document.getElementById('iconGlobe2'), baseIcon+"globe-asia-australia.svg");
    setIcon(document.getElementById('iconAdj1'), baseIcon+"adjustments-horizontal.svg");
    setIcon(document.getElementById('iconAdj2'), baseIcon+"adjustments-horizontal.svg");
    setIcon(document.getElementById('iconSortLabel'), baseIcon+"arrows-up-down.svg");
    setIcon(document.getElementById('iconBulb'), baseIcon+"light-bulb.svg");

    totalDisplay.innerHTML = `Total penduduk Indonesia: <strong>${totalPop.toLocaleString('id-ID')} rb</strong> jiwa`;

    // Populate island dropdown
    const islands = ["Semua", "Sumatera", "Jawa", "Kalimantan", "Sulawesi", "Nusa Tenggara & Bali", "Maluku & Papua"];
    islandSelect.innerHTML = islands.map(i => `<option value="${i}">${i === "Semua" ? "Semua Wilayah" : "Pulau "+i}</option>`).join('');
    islandSelect.value = selectedIsland;

    sortSelect.innerHTML = `
      <option value="pop-desc">Populasi Terbesar</option>
      <option value="pop-asc">Populasi Terkecil</option>
      <option value="name-asc">Nama A-Z</option>
      <option value="name-desc">Nama Z-A</option>
    `;
    sortSelect.value = currentSortRule;

    // Sync functions
    function syncFromSlidersToInputs() {
      minPop = parseFloat(minPopSlider.value);
      maxPopFilter = parseFloat(maxPopSlider.value);
      minPercent = parseFloat(minPctSlider.value);
      maxPercent = parseFloat(maxPctSlider.value);
      minPopInput.value = minPop;
      maxPopInput.value = maxPopFilter;
      minPctInput.value = minPercent;
      maxPctInput.value = maxPercent;
      applyAll();
    }

    function syncFromInputsToSliders() {
      let minP = parseFloat(minPopInput.value) || 0;
      let maxP = parseFloat(maxPopInput.value) || maxPop;
      let minPct = parseFloat(minPctInput.value) || 0;
      let maxPct = parseFloat(maxPctInput.value) || 100;
      if (minP > maxP) minP = maxP;
      if (minPct > maxPct) minPct = maxPct;
      minPop = minP; maxPopFilter = maxP; minPercent = minPct; maxPercent = maxPct;
      minPopSlider.value = minPop;
      maxPopSlider.value = maxPopFilter;
      minPctSlider.value = minPercent;
      maxPctSlider.value = maxPercent;
      minPopInput.value = minPop;
      maxPopInput.value = maxPopFilter;
      minPctInput.value = minPercent;
      maxPctInput.value = maxPercent;
      applyAll();
    }

    function applyAll() {
      renderChart();
    }

    function getFilteredAndSorted() {
      let filtered = provinsiData.filter(prov => {
        const matchName = prov.name.toLowerCase().includes(searchQuery.toLowerCase());
        const matchPop = prov.pop >= minPop && prov.pop <= maxPopFilter;
        const pct = getPercent(prov.pop);
        const matchPct = pct >= minPercent && pct <= maxPercent;
        const matchIsland = selectedIsland === "Semua" || prov.island === selectedIsland;
        return matchName && matchPop && matchPct && matchIsland;
      });

      return [...filtered].sort((a,b) => {
        if (currentSortRule === "pop-desc") return b.pop - a.pop;
        if (currentSortRule === "pop-asc") return a.pop - b.pop;
        if (currentSortRule === "name-asc") return a.name.localeCompare(b.name);
        if (currentSortRule === "name-desc") return b.name.localeCompare(a.name);
        return 0;
      });
    }

    function renderChart() {
      const data = getFilteredAndSorted();
      infoStat.innerHTML = `Menampilkan <strong>${data.length}</strong> dari <strong>${provinsiData.length}</strong> provinsi`;

      if (data.length === 0) {
        barsList.innerHTML = `<div class="no-data"><span>⚠️ Tidak ada provinsi yang sesuai filter.</span></div>`;
        return;
      }

      let html = '';
      data.forEach(prov => {
        const isMax = enableHighlight && prov.pop === maxPop;
        const isMin = enableHighlight && prov.pop === minPopData;
        const barWidth = (prov.pop / maxPop) * 100;
        const bgClass = (isMax ? 'highest-highlight' : '') + (isMin ? ' lowest-highlight' : '');
        const barClass = (isMax ? 'bar-max' : '') + (isMin ? ' bar-min' : '');
        const badgeHtml = (isMax ? '<span class="badge badge-max">Highest</span>' : '') + 
                          (isMin ? '<span class="badge badge-min">Lowest</span>' : '');
        
        html += `
          <div class="bar-item ${bgClass.trim()}">
            <div class="province-name">
              <span class="name-text">${prov.name}</span>
              <span class="region-tag">${prov.island}</span>
              ${badgeHtml}
            </div>
            <div class="bar-wrapper">
              <div class="bar ${barClass.trim()}" style="width:${barWidth}%;"></div>
            </div>
            <div class="pop-number">${prov.pop.toLocaleString('id-ID')} rb</div>
            <div class="percent-value">${getPercent(prov.pop).toFixed(2)}%</div>
          </div>
        `;
      });
      barsList.innerHTML = html;
    }

    // Event listeners
    searchInput.addEventListener('input', (e) => { searchQuery = e.target.value; applyAll(); });
    islandSelect.addEventListener('change', (e) => { selectedIsland = e.target.value; applyAll(); });
    highlightCheckbox.addEventListener('change', (e) => { enableHighlight = e.target.checked; applyAll(); });
    sortSelect.addEventListener('change', (e) => { currentSortRule = e.target.value; applyAll(); });

    minPopSlider.addEventListener('input', syncFromSlidersToInputs);
    maxPopSlider.addEventListener('input', syncFromSlidersToInputs);
    minPctSlider.addEventListener('input', syncFromSlidersToInputs);
    maxPctSlider.addEventListener('input', syncFromSlidersToInputs);

    minPopInput.addEventListener('change', syncFromInputsToSliders);
    maxPopInput.addEventListener('change', syncFromInputsToSliders);
    minPctInput.addEventListener('change', syncFromInputsToSliders);
    maxPctInput.addEventListener('change', syncFromInputsToSliders);

    // Init slider attributes & values
    minPopSlider.min = 0; minPopSlider.max = maxPop; minPopSlider.step = 100; minPopSlider.value = 0;
    maxPopSlider.min = 0; maxPopSlider.max = maxPop; maxPopSlider.step = 100; maxPopSlider.value = maxPop;
    minPctSlider.min = 0; minPctSlider.max = 100; minPctSlider.step = 0.5; minPctSlider.value = 0;
    maxPctSlider.min = 0; maxPctSlider.max = 100; maxPctSlider.step = 0.5; maxPctSlider.value = 100;
    minPopInput.value = 0; maxPopInput.value = maxPop; minPctInput.value = 0; maxPctInput.value = 100;

    renderChart();
  })();
</script>
</body>
